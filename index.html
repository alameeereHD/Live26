<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alameeere TV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            width: 90%;
            max-width: 800px;
            background: #161b22;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        video { width: 100%; border-radius: 8px; background: #000; }
        .badge {
            display: inline-block;
            padding: 5px 15px;
            background: #238636;
            border-radius: 20px;
            margin-bottom: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="badge" id="status">مباشر</div>
    <video id="video" controls autoplay playsinline></video>
</div>

<script>
    // الرابط المباشر الذي يعمل لديك
    const directUrl = 'http://103.76.130.131:8080/live/0545580310/7337741654/746717.m3u8?token=ThdWW0NHBE1UFV4XAVNVQU8aWlpCD0JLHRFZV0BYCRwXUExGUlsWUF5ZRg8UCVcWWxoVF1IZQlwWXQJValAARlxWURANWxBVXRtGXVcXDEFZGgpWBgAHDAALWg4FUVRWDVEEAVJXAQ4AVgEFVVxWBwIPGxkVCEVmFlYQTUdRBF1QRxYIBxlHUEJHRg9YEQgPTxpUVE8+VVYKXQZaQV0KXkYXDgMbFwhWX14QWkQ7FAoHGgMXBFYBAFQAQRUXWwtvUVBZU1lRRwMTBkYZFBQNB0ECGwECWQMBVRFPG0ZAF1VUWGtbUxdfDgUBUwQBSEYXClVcFw1QAQFcBlUKAQFdHBdAR1dFagxdEw1VAwVUV1pWRQ==';

    const video = document.getElementById('video');

    if (Hls.isSupported()) {
        const hls = new Hls({
            enableWorker: true,
            xhrSetup: function(xhr, url) {
                // إجبار المتصفح على جلب الملفات مباشرة
            }
        });
        hls.loadSource(directUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
            video.play().catch(() => {
                video.muted = true;
                video.play();
            });
        });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = directUrl;
        video.addEventListener('loadedmetadata', function() {
            video.play();
        });
    }
</script>

</body>
</html>
