<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alameeere TV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            width: 90%;
            max-width: 800px;
            background: #161b22;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .badge {
            background-color: #e3b341;
            color: #000;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        video {
            width: 100%;
            border-radius: 8px;
            background: #000;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Alameeere TV - القناة</h2>
        <span id="status" class="badge">جاري التحميل...</span>
    </div>
    <video id="video" controls playsinline poster=""></video>
</div>

<script>
    const streamUrl = 'https://live26.alameeeretv.workers.dev';
    const video = document.getElementById('video');
    const statusBadge = document.getElementById('status');

    if (Hls.isSupported()) {
        const hls = new Hls({
            enableWorker: true,
            lowLatencyMode: true,
            manifestLoadingTimeOut: 15000,
            manifestLoadingMaxRetry: 5,
            fragLoadingTimeOut: 20000,
            fragLoadingMaxRetry: 5
        });

        hls.loadSource(streamUrl);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, function () {
            if (statusBadge) {
                statusBadge.style.backgroundColor = '#238636';
                statusBadge.style.color = '#fff';
                statusBadge.innerText = 'مباشر';
            }
            video.play().catch(() => {
                video.muted = true;
                video.play();
            });
        });

        hls.on(Hls.Events.ERROR, function (event, data) {
            if (data.fatal) {
                switch (data.type) {
                    case Hls.ErrorTypes.NETWORK_ERROR:
                        hls.startLoad();
                        break;
                    case Hls.ErrorTypes.MEDIA_ERROR:
                        hls.recoverMediaError();
                        break;
                    default:
                        if (statusBadge) {
                            statusBadge.style.backgroundColor = '#da3633';
                            statusBadge.style.color = '#fff';
                            statusBadge.innerText = 'خطأ في جلب البث';
                        }
                        break;
                }
            }
        });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
        video.addEventListener('loadedmetadata', function () {
            video.play();
        });
    }
</script>

</body>
</html>
