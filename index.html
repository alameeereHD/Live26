<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alameeere TV - البث المباشر</title>
    <!-- مكتبة HLS.js لتشغيل ملفات m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .player-card {
            width: 100%;
            max-width: 900px;
            background: #161b22;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid #30363d;
        }
        .player-header {
            padding: 15px 20px;
            background: #21262d;
            border-bottom: 1px solid #30363d;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .player-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #f0f6fc;
        }
        .status-badge {
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 20px;
            background-color: #238636;
            color: #ffffff;
        }
        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background-color: #000000;
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <div class="player-header">
            <span class="player-title">Alameeere TV - القناة 746717</span>
            <span class="status-badge" id="status">مباشر</span>
        </div>
        <div class="video-container">
            <video id="video" controls autoplay playsinline></video>
        </div>
    </div>

    <script>
        // رابط البروكسي المباشر عبر Cloudflare Worker
        const streamUrl = 'https://live26.alameeeretv.workers.dev/stream/746717.m3u8';
        const video = document.getElementById('video');
        const statusBadge = document.getElementById('status');

        if (Hls.isSupported()) {
            const hls = new Hls({
                enableWorker: true,
                lowLatencyMode: true
            });
            hls.loadSource(streamUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function () {
                video.play().catch(() => {
                    video.muted = true;
                    video.play();
                });
            });
            hls.on(Hls.Events.ERROR, function (event, data) {
                if (data.fatal) {
                    statusBadge.style.backgroundColor = '#da3633';
                    statusBadge.innerText = 'خطأ في البث';
                }
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = streamUrl;
            video.addEventListener('loadedmetadata', function () {
                video.play();
            });
        } else {
            statusBadge.style.backgroundColor = '#da3633';
            statusBadge.innerText = 'المتصفح لا يدعم التشغيل';
        }
    </script>
</body>
</html>
